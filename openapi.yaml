openapi: 3.1.0

info:
  title: dsh-pet HTTP API
  version: 0.3.7
  summary: DSH 桌宠插件的宿主 HTTP 接口
  description: |
    dsh-pet 的宿主（host）半侧通过 DSH 的 `webServer` 服务注册**一条前缀路由** `/dsh-pet-7340`，
    浏览器半侧、桌面 Electron 半侧、以及设置页全都消费同一份实现（`handlePetRoute`）。
    本文件是该路由的公开契约：任何第三方插件 / 脚本都可以按此访问桌宠能力。

    ## 部署形态

    接口挂在 **DSH 自己的 Web 服务**上，因此没有固定端口：

    - `servers` 里的 `http://127.0.0.1:{port}` 是占位——`{port}` 就是 `ctx.webServer.port`，
      也就是 `dsh web` 启动时打印的地址（未显式指定端口时默认 3080）。
      插件本身不固定监听端口，只往宿主的 Web 服务上挂路由。
    - 只监听 **127.0.0.1**，不对外网暴露，也**没有任何鉴权**：任何能访问本机该端口的进程都能调用。
      请勿把该端口转发/代理到公网。
    - 桌面半侧不走 HTTP，而是 `dsh-pet-bridge://` 自定义 scheme 经主进程管道转发到**同一个**
      `handlePetRoute`。所以下表所有路径对两端行为完全一致。

    ## 两分钟上手

    ```bash
    BASE=http://127.0.0.1:3080/dsh-pet-7340

    # 1. 拉一次统一状态（只读、零副作用，可以随便轮询）
    curl -s $BASE/state

    # 2. 让 main 这只宠物立刻说一句（响应里就带 text；同一份同时写进 /state）
    curl -s -X POST "$BASE/whisper?pet=main"
    curl -s $BASE/state   # → pets.main.say.data.text（与上面返回的 text 逐字相同）
    ```

    ## 数据流：为什么有"动作端点"和"/state"两套

    这是本 API 最重要的一条约定，理解了它其余都是细节：

    1. **数据只有一个出口**：`GET /state`。它返回宿主内存里的一份"已发布状态" S，
       里面是若干 **叶子（leaf）**，每个叶子形如 `{ counter, data }`。
    2. **动作端点只回执，不搬数据**：`POST /balance`、`POST /broadcast`、`POST /bubble/clear`、
       `POST /anim` 只回 `{ ok: true }`，表示"这次动作做完了"。它们在宿主内部把结果**写进 S**，
       调用方随后拉一拍 `/state` 就能看到。

       例外是**要生成内容的两个端点**：`POST /whisper` 与 `POST /chat` 成功时**额外带回**
       生成的 `text`（配图时带 `image`）。这只是省一次往返，不是新增的数据出口——同一份文本
       仍然照旧写进 S，其它消费端的行为完全不变。
    3. **`counter` 是"变了没有"的唯一信号**：它是 `Date.now()` 且**严格递增**（同毫秒连写会 +1），
       宿主重启也不会倒退。消费端只比较 `counter` 是否与自己上次记录的一致，一致就跳过渲染。
       这样前端不需要任何业务知识就能统一处理所有叶子。

    因此推荐的消费姿势是：

    - **要数据** → 每秒 `GET /state`，比对 `counter`，只处理变化的叶子。
    - **要触发行为** → `POST` 对应动作端点，收到 `ok` 后**立刻**再 `GET /state` 一次，
      即可 0 延迟拿到结果（不必等下一个轮询周期）。

