# ============================================================================
# dsh-cordis-probe 的 bundle patch —— 把探针挂进 DSH 配置树
# ============================================================================
#
# 【为什么需要这个文件】
#   DSH 的「添加插件」入口只接受**组合包**（package.json 里声明 dsh.bundle.patch），
#   只声明 dsh.client 的包会被拒绝：
#     "这个包没有声明组合包，无法作为插件安装：<name> declares no dsh.bundle"
#
# 【约定】
#   - insert：往配置树里加一行插件 entry
#   - id 必须与包名一致，且全局唯一
#   - "id: 值" 那一行不能写行尾注释（商城预检用正则抓该行的值）
#
# 【装上之后】
#   不需要再手动改 profile 的 dependencies / bundles —— 插件管理器会把本包装进
#   profile 并把这一层 patch 叠加到配置树上。
#
# ============================================================================

- insert:
    - id: dsh-cordis-probe
      name: 'dsh-cordis-probe'
